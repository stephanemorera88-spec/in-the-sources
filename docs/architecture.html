<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In the Sources · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;1,400&family=Schibsted+Grotesk:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #ffffff;
      --color-ink:    #111110;
      --color-muted:  #4a4946;
      --color-accent: #2856ff;
      --font-sans:    'Schibsted Grotesk', system-ui, sans-serif;
      --font-serif:   'Source Serif 4', Georgia, serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    .diagram { overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture</p>
    <h1>In the Sources, as deployed</h1>

    <div class="diagram">
    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="its-architecture-title its-architecture-desc">
      <title id="its-architecture-title">In the Sources, as deployed</title>
      <desc id="its-architecture-desc">Architecture diagram showing a buyer paying through Stripe, the webhook minting a license in the Next.js app on Vercel, the app storing projects and encrypted keys in Postgres, calling OpenAI, Anthropic and Gemini with the user's own keys, emailing the license through Resend, and a daily Vercel cron re-running every project.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a4946"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2856ff"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0b1a4a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zone: Vercel (drawn before arrows and nodes) -->
      <rect x="232" y="208" width="208" height="224" rx="8" fill="rgba(17,17,16,0.02)" stroke="rgba(17,17,16,0.10)" stroke-width="0.8"/>
      <rect x="312" y="212" width="48" height="12" rx="2" fill="#ffffff"/>
      <text x="336" y="221" fill="#6f6d68" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">VERCEL</text>

      <!-- Arrows first (behind boxes) -->
      <!-- Buyer -> Stripe: vertical, buyer top edge to Stripe bottom edge -->
      <line x1="112" y1="256" x2="112" y2="160" stroke="#4a4946" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Buyer -> App: HTTPS, straight -->
      <line x1="184" y1="272" x2="248" y2="272" stroke="#0b1a4a" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Stripe -> App: webhook, leaves Stripe right edge, enters app top edge -->
      <path d="M 184,128 H 296 Q 304,128 304,136 V 240" fill="none" stroke="#0b1a4a" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- App -> Resend: leaves app right edge (port 1 of 3), enters Resend bottom edge -->
      <path d="M 424,256 H 584 Q 592,256 592,248 V 160" fill="none" stroke="#4a4946" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- App -> Postgres: straight (port 2 of 3) -->
      <line x1="424" y1="272" x2="712" y2="272" stroke="#4a4946" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- App -> Engines: accent, two-bend elbow (port 3 of 3) -->
      <path d="M 424,288 H 560 Q 568,288 568,296 V 380 Q 568,388 576,388 H 712" fill="none" stroke="#2856ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Cron -> App: dashed vertical, cron top edge to app bottom edge -->
      <line x1="336" y1="352" x2="336" y2="304" stroke="#4a4946" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels (mask, then text) -->
      <rect x="124" y="196" width="52" height="12" rx="2" fill="#ffffff"/>
      <text x="150" y="205" fill="#6f6d68" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PAY ONCE</text>

      <rect x="196" y="252" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="216" y="261" fill="#0b1a4a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

      <rect x="316" y="164" width="48" height="12" rx="2" fill="#ffffff"/>
      <text x="340" y="173" fill="#0b1a4a" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WEBHOOK</text>

      <rect x="604" y="192" width="80" height="12" rx="2" fill="#ffffff"/>
      <text x="644" y="201" fill="#6f6d68" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LICENSE EMAIL</text>

      <rect x="636" y="252" width="32" height="12" rx="2" fill="#ffffff"/>
      <text x="652" y="261" fill="#6f6d68" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SQL</text>

      <rect x="580" y="328" width="68" height="12" rx="2" fill="#ffffff"/>
      <text x="614" y="337" fill="#2856ff" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BYOK CALLS</text>

      <rect x="348" y="320" width="40" height="12" rx="2" fill="#ffffff"/>
      <text x="368" y="329" fill="#6f6d68" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DAILY</text>

      <!-- Node: Buyer (input) -->
      <rect x="40" y="256" width="144" height="64" rx="6" fill="#ffffff"/>
      <rect x="40" y="256" width="144" height="64" rx="6" fill="rgba(74,73,70,0.10)" stroke="#6f6d68" stroke-width="1"/>
      <rect x="48" y="262" width="28" height="12" rx="2" fill="transparent" stroke="rgba(111,109,104,0.40)" stroke-width="0.8"/>
      <text x="62" y="271" fill="#6f6d68" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">USR</text>
      <text x="112" y="290" fill="#111110" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Buyer</text>
      <text x="112" y="306" fill="#4a4946" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">browser · cookie</text>

      <!-- Node: Stripe (external) -->
      <rect x="40" y="96" width="144" height="64" rx="6" fill="#ffffff"/>
      <rect x="40" y="96" width="144" height="64" rx="6" fill="rgba(17,17,16,0.03)" stroke="rgba(17,17,16,0.30)" stroke-width="1"/>
      <rect x="48" y="102" width="28" height="12" rx="2" fill="transparent" stroke="rgba(17,17,16,0.22)" stroke-width="0.8"/>
      <text x="62" y="111" fill="#6f6d68" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PAY</text>
      <text x="112" y="130" fill="#111110" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Stripe</text>
      <text x="112" y="146" fill="#4a4946" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Payment Link · webhook</text>

      <!-- Node: Next.js app (focal) -->
      <rect x="248" y="240" width="176" height="64" rx="6" fill="#ffffff"/>
      <rect x="248" y="240" width="176" height="64" rx="6" fill="rgba(40,86,255,0.08)" stroke="#2856ff" stroke-width="1"/>
      <rect x="256" y="246" width="28" height="12" rx="2" fill="transparent" stroke="rgba(40,86,255,0.50)" stroke-width="0.8"/>
      <text x="270" y="255" fill="#2856ff" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="336" y="274" fill="#111110" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Next.js app</text>
      <text x="336" y="290" fill="#4a4946" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pages · /api routes</text>

      <!-- Node: Cron (optional / async) -->
      <rect x="248" y="352" width="176" height="56" rx="6" fill="#ffffff"/>
      <rect x="248" y="352" width="176" height="56" rx="6" fill="rgba(17,17,16,0.02)" stroke="rgba(17,17,16,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="256" y="358" width="32" height="12" rx="2" fill="transparent" stroke="rgba(17,17,16,0.22)" stroke-width="0.8"/>
      <text x="272" y="367" fill="#6f6d68" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CRON</text>
      <text x="336" y="382" fill="#111110" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Daily run</text>
      <text x="336" y="398" fill="#4a4946" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">/api/cron/daily · 11:00 UTC</text>

      <!-- Node: Resend (external) -->
      <rect x="520" y="96" width="144" height="64" rx="6" fill="#ffffff"/>
      <rect x="520" y="96" width="144" height="64" rx="6" fill="rgba(17,17,16,0.03)" stroke="rgba(17,17,16,0.30)" stroke-width="1"/>
      <rect x="528" y="102" width="32" height="12" rx="2" fill="transparent" stroke="rgba(17,17,16,0.22)" stroke-width="0.8"/>
      <text x="544" y="111" fill="#6f6d68" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MAIL</text>
      <text x="592" y="130" fill="#111110" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Resend</text>
      <text x="592" y="146" fill="#4a4946" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">key in the URL fragment</text>

      <!-- Node: Postgres (store) -->
      <rect x="712" y="240" width="168" height="64" rx="6" fill="#ffffff"/>
      <rect x="712" y="240" width="168" height="64" rx="6" fill="rgba(17,17,16,0.05)" stroke="#4a4946" stroke-width="1"/>
      <rect x="720" y="246" width="24" height="12" rx="2" fill="transparent" stroke="rgba(74,73,70,0.50)" stroke-width="0.8"/>
      <text x="732" y="255" fill="#4a4946" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="796" y="274" fill="#111110" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Postgres</text>
      <text x="796" y="290" fill="#4a4946" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">projects · runs · keys (AES)</text>

      <!-- Node: AI engines (external) -->
      <rect x="712" y="352" width="168" height="72" rx="6" fill="#ffffff"/>
      <rect x="712" y="352" width="168" height="72" rx="6" fill="rgba(17,17,16,0.03)" stroke="rgba(17,17,16,0.30)" stroke-width="1"/>
      <rect x="720" y="358" width="32" height="12" rx="2" fill="transparent" stroke="rgba(17,17,16,0.22)" stroke-width="0.8"/>
      <text x="736" y="367" fill="#6f6d68" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BYOK</text>
      <text x="796" y="386" fill="#111110" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">AI engines</text>
      <text x="796" y="402" fill="#4a4946" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">OpenAI · Anthropic · Gemini</text>
      <text x="796" y="414" fill="#4a4946" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">web search on · your keys</text>

      <!-- Legend strip -->
      <line x1="40" y1="500" x2="920" y2="500" stroke="rgba(17,17,16,0.10)" stroke-width="0.8"/>
      <text x="40" y="516" fill="#4a4946" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="40" y="532" width="14" height="10" rx="2" fill="rgba(40,86,255,0.08)" stroke="#2856ff" stroke-width="1"/>
      <text x="60" y="540" fill="#4a4946" font-size="8.5" font-family="'Schibsted Grotesk', system-ui, sans-serif">The app</text>

      <rect x="148" y="532" width="14" height="10" rx="2" fill="rgba(17,17,16,0.03)" stroke="rgba(17,17,16,0.30)" stroke-width="1"/>
      <text x="168" y="540" fill="#4a4946" font-size="8.5" font-family="'Schibsted Grotesk', system-ui, sans-serif">Third-party service</text>

      <rect x="300" y="532" width="14" height="10" rx="2" fill="rgba(17,17,16,0.05)" stroke="#4a4946" stroke-width="1"/>
      <text x="320" y="540" fill="#4a4946" font-size="8.5" font-family="'Schibsted Grotesk', system-ui, sans-serif">Store</text>

      <rect x="380" y="532" width="14" height="10" rx="2" fill="rgba(74,73,70,0.10)" stroke="#6f6d68" stroke-width="1"/>
      <text x="400" y="540" fill="#4a4946" font-size="8.5" font-family="'Schibsted Grotesk', system-ui, sans-serif">User</text>

      <rect x="456" y="532" width="14" height="10" rx="2" fill="rgba(17,17,16,0.02)" stroke="rgba(17,17,16,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="476" y="540" fill="#4a4946" font-size="8.5" font-family="'Schibsted Grotesk', system-ui, sans-serif">Scheduled</text>

      <line x1="560" y1="537" x2="588" y2="537" stroke="#0b1a4a" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="596" y="540" fill="#4a4946" font-size="8.5" font-family="'Schibsted Grotesk', system-ui, sans-serif">HTTP request</text>

      <line x1="692" y1="537" x2="720" y2="537" stroke="#2856ff" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="728" y="540" fill="#4a4946" font-size="8.5" font-family="'Schibsted Grotesk', system-ui, sans-serif">The product call</text>

      <line x1="836" y1="537" x2="864" y2="537" stroke="#4a4946" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="872" y="540" fill="#4a4946" font-size="8.5" font-family="'Schibsted Grotesk', system-ui, sans-serif">Async</text>
    </svg>
    </div>
  </div>
</body>
</html>
